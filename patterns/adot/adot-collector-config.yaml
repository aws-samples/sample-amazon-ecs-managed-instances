extensions:
  sigv4auth:
    region: <AWS_REGION>

processors:
  resource:
    attributes:
      - key: ClusterName
        value: "__CLUSTER_NAME__"
        action: upsert
      - key: CapacityProviderName
        value: "__CAPACITY_PROVIDER_NAME__"
        action: upsert
      - key: ContainerInstanceId
        value: "__CONTAINER_INSTANCE_ID__"
        action: upsert
      - key: EC2InstanceId
        value: "__EC2_INSTANCE_ID__"
        action: upsert
      - key: InstanceType
        value: "__INSTANCE_TYPE__"
        action: upsert
      - key: RegisteredCPU
        value: "__REGISTERED_CPU__"
        action: upsert
      - key: RegisteredMemory
        value: "__REGISTERED_MEMORY__"
        action: upsert
  batch:
    send_batch_size: 200
    timeout: 10s
  filter/scrape_junk:
    metrics:
      exclude:
        match_type: regexp
        metric_names:
          - scrape_.*
          - up
          - target_info

receivers:
  prometheus/node_exporter:
    config:
      scrape_configs:
        - job_name: node-exporter
          scrape_interval: 60s
          static_configs:
            - targets:
                - localhost:9100
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "node_(cpu_seconds_total|memory_Mem(Total|Available|Free)_bytes|filesystem_(size|avail)_bytes|disk_(read|written)_bytes_total|network_(receive|transmit)_(bytes|errs|drop)_total|load(1|5|15))"
              action: keep
            - source_labels: [__name__, mode]
              regex: "node_cpu_seconds_total;(idle|nice|irq|softirq|steal)"
              action: drop

exporters:
  prometheusremotewrite/amp:
    endpoint: "https://aps-workspaces.<AWS_REGION>.amazonaws.com/workspaces/<AMP_WORKSPACE_ID>/api/v1/remote_write"
    auth:
      authenticator: sigv4auth
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [sigv4auth]
  pipelines:
    metrics/host:
      receivers: [prometheus/node_exporter]
      processors: [filter/scrape_junk, resource, batch]
      exporters: [prometheusremotewrite/amp]
